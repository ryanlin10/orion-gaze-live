[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gaze-live"
dynamic = ["version"]
description = "A live heatmap of where you're looking, predicted by Orion's Gaze API from your screen and input. No webcam."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ryan Lin" }]
requires-python = ">=3.10"
keywords = ["gaze", "eye tracking", "attention", "heatmap", "macos", "orion"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: MacOS X :: Cocoa",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Human Machine Interfaces",
]
dependencies = [
  "numpy>=1.26",
  "pillow>=10.0",
  "truststore>=0.10",
  "websockets>=14.0",
  "pyobjc-framework-Cocoa>=10.3; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz>=10.3; sys_platform == 'darwin'",
  "pyobjc-framework-ScreenCaptureKit>=10.3; sys_platform == 'darwin'",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
gaze-live = "gazelive.cli:main"

[project.urls]
Homepage = "https://github.com/ryanlin10/orion-gaze-live"
"API docs" = "https://app.paradigmmachines.ai/docs/gaze-api"
Issues = "https://github.com/ryanlin10/orion-gaze-live/issues"

[tool.setuptools]
packages = ["gazelive"]

[tool.setuptools.dynamic]
version = { attr = "gazelive.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
